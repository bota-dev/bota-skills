name: Customer skills release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: customer-skills-release
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.19.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-catalog.mjs
      - run: node --test tests/*.test.mjs webhook-handling/tests/*.test.mjs
      - name: Build and verify the clean tagged source
        run: node scripts/build-release.mjs --output "$RUNNER_TEMP/bota-skills-release"

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: customer-skills-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Publish once and verify the immutable public release
        run: node scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUSTOMER_SKILLS_RELEASE_APPROVAL: ${{ vars.CUSTOMER_SKILLS_RELEASE_APPROVAL }}
          CUSTOMER_SKILLS_IMMUTABLE_RELEASES: ${{ vars.CUSTOMER_SKILLS_IMMUTABLE_RELEASES }}
